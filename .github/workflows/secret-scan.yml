name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: this job is the leak guard, so a moved tag mustn't change it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # full history: the repo is small, so every run scans every commit
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2.4.4, installs the gitleaks pinned in mise.toml
      - run: gitleaks git --redact --verbose --config .gitleaks.toml .
